stages:
  - build
  - push
  - cleanup

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""   # Required for docker:dind
  IMAGE_NAME: "$CI_PROJECT_NAME"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

services:
  - docker:dind

before_script:
  - docker info

build_image:
  stage: build
  image: docker:latest
  script:
    - REGISTRY_IMAGE="${REGISTRY_URL}/${IMAGE_NAME}:${IMAGE_TAG}"
    - echo "Building image $REGISTRY_IMAGE..."
    - docker build -t "$REGISTRY_IMAGE" .
  artifacts:
    expire_in: 1h
    paths:
      - .

push_image:
  stage: push
  image: docker:latest
  script:
    - REGISTRY_IMAGE="${REGISTRY_URL}/${IMAGE_NAME}:${IMAGE_TAG}"
    - echo "Logging into registry..."
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin
    - echo "Pushing image to registry..."
    - docker push "$REGISTRY_IMAGE"
  dependencies:
    - build_image
  only:
    - main
    - master
    - tags

cleanup:
  stage: cleanup
  image: docker:latest
  script:
    - echo "Cleaning up local Docker images and cache..."
    - docker system prune -af
  when: always

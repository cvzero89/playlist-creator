stages:
  - build_and_push
  - cleanup

variables:
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "$CI_PROJECT_NAME"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  BRANCH_TAG: "$CI_COMMIT_REF_SLUG"

build_and_push:
  stage: build_and_push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin
  script:
    - echo "Building image for branch $CI_COMMIT_REF_NAME"
    - docker build -t "$REGISTRY_URL/$IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$REGISTRY_URL/$IMAGE_NAME:$IMAGE_TAG"
    - echo "Tagging image with branch-specific tag $BRANCH_TAG"
    - docker tag "$REGISTRY_URL/$IMAGE_NAME:$IMAGE_TAG" "$REGISTRY_URL/$IMAGE_NAME:$BRANCH_TAG"
    - docker push "$REGISTRY_URL/$IMAGE_NAME:$BRANCH_TAG"
    - if [ "$CI_COMMIT_REF_NAME" = "main" ]; then echo "Branch is main, tagging and pushing latest"; docker tag "$REGISTRY_URL/$IMAGE_NAME:$IMAGE_TAG" "$REGISTRY_URL/$IMAGE_NAME:latest"; docker push "$REGISTRY_URL/$IMAGE_NAME:latest"; fi

cleanup:
  stage: cleanup
  image: docker:latest
  script:
    - docker system prune -af
  when: always
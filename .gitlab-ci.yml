stages:
  - build_and_push
  - cleanup

variables:
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "$CI_PROJECT_NAME"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

services:
  - docker:dind

variables:
  IMAGE_NAME: "playlist-creator"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  BRANCH_TAG: "$CI_COMMIT_REF_SLUG"

build_and_push:
  stage: build
  script:
    - echo "Building image for branch: $CI_COMMIT_REF_NAME"
    - docker build -t "$REGISTRY_URL/$IMAGE_NAME:$IMAGE_TAG" .

    - docker tag "$REGISTRY_URL/$IMAGE_NAME:$IMAGE_TAG" "$REGISTRY_URL/$IMAGE_NAME:$BRANCH_TAG"

    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

    - docker push "$REGISTRY_URL/$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$REGISTRY_URL/$IMAGE_NAME:$BRANCH_TAG"

    - |
      if [[ "$CI_COMMIT_REF_NAME" == "main" ]]; then
        echo "Tagging and pushing 'latest'..."
        docker tag "$REGISTRY_URL/$IMAGE_NAME:$IMAGE_TAG" "$REGISTRY_URL/$IMAGE_NAME:latest"
        docker push "$REGISTRY_URL/$IMAGE_NAME:latest"
      else
        echo "Not main branch → skipping 'latest' tag"
      fi


cleanup:
  stage: cleanup
  image: docker:latest
  script:
    - docker system prune -af
  when: always